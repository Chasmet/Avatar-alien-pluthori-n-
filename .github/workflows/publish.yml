name: CHK Alien Live - Publish Signed Release MAJAUTO
on:
  push:
    branches: [main]
    paths:
      - "distribution/**"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: SDK Android 34
        run: sdkmanager "build-tools;34.0.0"
      - name: Reconstituer l'APK stable avec signature publique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PATCH="$(python3 -c 'import json; d=json.load(open("update.json"));print("distribution/v"+d["versionName"]+"-signature-delta.json")')"
          RUN="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["source_run_id"])' "$PATCH")"
          NAME="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["artifact_name"])' "$PATCH")"
          mkdir -p "$RUNNER_TEMP/chk-unsigned"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name "$NAME" --dir "$RUNNER_TEMP/chk-unsigned"
          python3 tools/reconstruct_signed_apk.py "$RUNNER_TEMP/chk-unsigned" "$PATCH"
      - name: Verify APK signature, version and SHA-256
        run: python3 tools/verify_release.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(python3 -c 'import json; d=json.load(open("update.json"));print("chk-alien-live-v"+d["versionName"])')"
          APK="$(python3 -c 'import json, pathlib;d=json.load(open("update.json"));print("distribution/"+pathlib.PurePosixPath(d["apkUrl"]).name)')"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" update.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "APK Android stable signe, mise a jour integree MAJAUTO"
          fi

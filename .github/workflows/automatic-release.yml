name: CHK Pluthor - Signed Auto Release
on:
  workflow_run:
    workflows: ["CHK Alien Live - Build Android APK"]
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  sign-and-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android signing tools
        run: sdkmanager "build-tools;34.0.0"
      - name: Check permanent signing key is available
        id: key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$APK_KEYSTORE_BASE64" ] || [ -z "$APK_KEYSTORE_PASSWORD" ] || [ -z "$APK_KEY_ALIAS" ] || [ -z "$APK_KEY_PASSWORD" ]; then
            echo "::error::Stable APK signing secrets are missing. Cannot publish an in-app update with the existing certificate."
            exit 1
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download compiled Android release
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chk-unsigned"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name CHK-Alien-Live-Honor-Release-Unsigned --dir "$RUNNER_TEMP/chk-unsigned"
          test -s "$RUNNER_TEMP/chk-unsigned/app-honor-release-unsigned.apk"
      - name: Sign and validate against the permanent certificate
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chk-keystore.jks"
          mkdir -p "$RUNNER_TEMP/chk-reference" distribution
          gh release download chk-alien-live-v0.6.9 --repo "$GITHUB_REPOSITORY" --pattern "CHK-Alien-Live-v0.6.9.apk" --dir "$RUNNER_TEMP/chk-reference"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          UNSIGNED="$RUNNER_TEMP/chk-unsigned/app-honor-release-unsigned.apk"
          BADGING=$("$AAPT" dump badging "$UNSIGNED" | head -n 1)
          VERSION=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          test -n "$VERSION" && test -n "$CODE"
          echo "$BADGING" | grep "package: name='fr.chk.alienlive'"
          APK="distribution/CHK-Alien-Live-v$VERSION.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/chk-keystore.jks" --ks-key-alias "$APK_KEY_ALIAS" --ks-pass env:APK_KEYSTORE_PASSWORD --key-pass env:APK_KEY_PASSWORD --out "$APK" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          EXPECTED=$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/chk-reference/CHK-Alien-Live-v0.6.9.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signing certificate differs from installed stable APK"; exit 1
          fi
          rm -f "$RUNNER_TEMP/chk-keystore.jks"
          SHA256=$(sha256sum "$APK" | cut -d ' ' -f 1)
          export VERSION CODE SHA256
          python3 - <<'PY'
          import json, os
          v=os.environ["VERSION"]
          info={"versionCode":int(os.environ["CODE"]),"versionName":v,
                "packageName":"fr.chk.alienlive",
                "apkUrl":f"https://github.com/Chasmet/Avatar-alien-pluthori-n-/releases/download/chk-alien-live-v{v}/CHK-Alien-Live-v{v}.apk",
                "sha256":os.environ["SHA256"]}
          with open("update.json","w",encoding="utf-8") as output:
              json.dump(info,output,ensure_ascii=False,indent=2)
              output.write("\n")
          PY
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
      - name: Publish verified APK and update metadata
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="chk-alien-live-v$APK_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "CHK Pluthor v$APK_VERSION" --notes "Version signée automatiquement, installation par-dessus la version actuelle."
          fi
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/update.json" --jq .sha)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/update.json" \
            -f message="MAJAUTO: publier v$APK_VERSION" \
            -f branch=main -f sha="$CURRENT_SHA" \
            -f content="$(base64 -w0 update.json)" >/dev/null

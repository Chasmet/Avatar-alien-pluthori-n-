// Gradle exposes the producing task to every asset consumer, including lint.
// The installed app reads the verified model from its APK without a network call.
abstract class PrepareFaceLandmarker extends DefaultTask {
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @Input abstract Property<String> getModelUrl()
    @Input abstract Property<String> getExpectedHash()

    private static String hash(File file) {
        java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
    }

    @TaskAction void prepare() {
        File dir = outputDirectory.get().asFile
        dir.mkdirs()
        File dest = new File(dir, 'face_landmarker.task')
        if (dest.isFile() && hash(dest) == expectedHash.get()) return
        File tmp = File.createTempFile('face_landmarker-', '.tmp', dir)
        try {
            def connection = new URL(modelUrl.get()).openConnection()
            connection.connectTimeout = 15000
            connection.readTimeout = 60000
            connection.inputStream.withCloseable { input ->
                tmp.withOutputStream { output -> output << input }
            }
            if (hash(tmp) != expectedHash.get()) throw new GradleException('Modèle facial Google incomplet')
            java.nio.file.Files.move(tmp.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally {
            tmp.delete()
        }
    }
}
android.androidResources.noCompress += 'task'
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    if (variant.flavorName == 'honor') {
        def prepareModel = tasks.register("prepare${variant.name.capitalize()}FaceModel", PrepareFaceLandmarker) {
            modelUrl.set('https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task')
            expectedHash.set('64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff')
        }
        variant.sources.assets.addGeneratedSourceDirectory(prepareModel, { task -> task.outputDirectory })
    }
}
